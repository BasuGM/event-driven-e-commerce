openapi: 3.0.3
info:
  title: Event-driven e-commerce API
  version: 0.1.0
  description: E-commerce platform seeded with the Olist Brazilian E-Commerce dataset.
paths:
  /api/auth/csrf/:
    get:
      operationId: auth_csrf_retrieve
      description: Sets the csrftoken cookie. The browser sends it back as X-CSRFToken
        on unsafe requests.
      summary: Get a CSRF token (sets the csrftoken cookie)
      tags:
      - auth
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Csrf'
          description: ''
  /api/auth/login/:
    post:
      operationId: auth_login_create
      summary: Log in with email and password
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      summary: Log out
      tags:
      - auth
      security:
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      summary: The logged-in user, or null
      tags:
      - auth
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/auth/register/:
    post:
      operationId: auth_register_create
      summary: Create an account and log in
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/cart/:
    get:
      operationId: cart_retrieve
      summary: Your cart with current prices and availability
      tags:
      - cart
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
  /api/cart/items/:
    post:
      operationId: cart_items_create
      summary: Add an offer to your cart
      tags:
      - cart
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCartItemRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AddCartItemRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AddCartItemRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
  /api/cart/items/{item_id}/:
    patch:
      operationId: cart_items_partial_update
      summary: Change a line's quantity
      parameters:
      - in: path
        name: item_id
        schema:
          type: integer
        required: true
      tags:
      - cart
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUpdateCartItemRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUpdateCartItemRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUpdateCartItemRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
    delete:
      operationId: cart_items_destroy
      summary: Remove a line
      parameters:
      - in: path
        name: item_id
        schema:
          type: integer
        required: true
      tags:
      - cart
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/categories/:
    get:
      operationId: categories_list
      summary: Categories that have at least one product
      tags:
      - categories
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
          description: ''
  /api/checkout/:
    post:
      operationId: checkout_create
      summary: Place an order from your cart (holds stock until you pay)
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: Unique per checkout attempt (8-255 chars). Retries reuse it.
        required: true
      tags:
      - checkout
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainError'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainError'
          description: ''
  /api/health/:
    get:
      operationId: health_retrieve
      summary: Status of the database and Redis
      tags:
      - health
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/orders/:
    get:
      operationId: orders_list
      summary: Your orders, newest first
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - orders
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOrderListList'
          description: ''
  /api/orders/{order_id}/:
    get:
      operationId: orders_retrieve
      summary: One of your orders
      parameters:
      - in: path
        name: order_id
        schema:
          type: string
        required: true
      tags:
      - orders
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
          description: ''
  /api/orders/{order_id}/cancel/:
    post:
      operationId: orders_cancel_create
      summary: Cancel an unpaid order (returns its stock)
      parameters:
      - in: path
        name: order_id
        schema:
          type: string
        required: true
      tags:
      - orders
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainError'
          description: ''
  /api/orders/{order_id}/payment/:
    post:
      operationId: orders_payment_create
      summary: 'Start paying for an order: creates (or reuses) its payment, returns
        where to pay'
      parameters:
      - in: path
        name: order_id
        schema:
          type: string
        required: true
      tags:
      - orders
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentStart'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainError'
          description: ''
  /api/products/:
    get:
      operationId: products_list
      summary: Browse, filter and search products
      parameters:
      - in: query
        name: category
        schema:
          type: string
          minLength: 1
          pattern: ^[-a-zA-Z0-9_]+$
        description: Category slug
      - in: query
        name: in_stock
        schema:
          type: boolean
          nullable: true
        description: true = only products you can buy
      - in: query
        name: max_price
        schema:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
      - in: query
        name: min_price
        schema:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
      - in: query
        name: min_rating
        schema:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,2})?$
      - in: query
        name: ordering
        schema:
          enum:
          - popular
          - price
          - -price
          - rating
          - newest
          type: string
          minLength: 1
        description: |-
          Default: relevance when searching, otherwise popular

          * `popular` - popular
          * `price` - price
          * `-price` - -price
          * `rating` - rating
          * `newest` - newest
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
          maxLength: 100
        description: Search product and category names (prefix match, e.g. 'duv cov')
      tags:
      - products
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProductListList'
          description: ''
  /api/products/{slug}/:
    get:
      operationId: products_retrieve
      summary: Product detail with offers
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - products
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetail'
          description: ''
  /api/products/{slug}/reviews/:
    get:
      operationId: products_reviews_list
      summary: Reviews of orders containing this product, newest first
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - products
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProductReviewList'
          description: ''
  /api/staff/analytics/:
    get:
      operationId: staff_analytics_retrieve
      description: 'Business metrics: staff only (404 for everyone else), like the
        event explorer.'
      summary: Analytics dashboard data (staff)
      parameters:
      - in: query
        name: date_from
        schema:
          type: string
        description: YYYY-MM-DD (purchase day, Sao Paulo time)
      - in: query
        name: date_to
        schema:
          type: string
        description: YYYY-MM-DD
      - in: query
        name: source
        schema:
          type: string
          enum:
          - all
          - app
          - olist
          - replay
      tags:
      - staff
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
          description: ''
  /api/staff/dead-letters/{entry_id}/retry/:
    post:
      operationId: staff_dead_letters_retry_create
      summary: Re-deliver a dead-lettered event to its stream (staff; idempotent)
      parameters:
      - in: path
        name: entry_id
        schema:
          type: string
        required: true
      tags:
      - staff
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeadLetterRetry'
          description: ''
  /api/staff/events/:
    get:
      operationId: staff_events_list
      summary: 'Event log (staff): newest first'
      parameters:
      - in: query
        name: aggregate_id
        schema:
          type: string
      - in: query
        name: date_from
        schema:
          type: string
        description: YYYY-MM-DD
      - in: query
        name: date_to
        schema:
          type: string
        description: YYYY-MM-DD
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: type
        schema:
          type: string
      tags:
      - staff
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEventLogList'
          description: ''
  /api/staff/events/types/:
    get:
      operationId: staff_events_types_retrieve
      summary: Event types seen in the log (staff)
      tags:
      - staff
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
          description: ''
  /api/staff/health/:
    get:
      operationId: staff_health_retrieve
      summary: Consumer groups, outbox backlog and dead letters (staff)
      tags:
      - staff
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffHealth'
          description: ''
  /api/staff/orders/{order_id}/events/:
    get:
      operationId: staff_orders_events_list
      summary: Every event for one order, oldest first, with consumer status (staff)
      parameters:
      - in: path
        name: order_id
        schema:
          type: string
        required: true
      tags:
      - staff
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TimelineEvent'
          description: ''
  /api/stats/:
    get:
      operationId: stats_retrieve
      summary: Row counts for the dashboard
      tags:
      - stats
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stats'
          description: ''
components:
  schemas:
    AddCartItemRequest:
      type: object
      properties:
        offer_id:
          type: integer
        quantity:
          type: integer
          maximum: 10
          minimum: 1
          default: 1
      required:
      - offer_id
    BlankEnum:
      enum:
      - ''
    Cart:
      type: object
      properties:
        lines:
          type: array
          items:
            $ref: '#/components/schemas/CartLine'
        item_count:
          type: integer
          description: Total units
        subtotal:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        freight_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        total:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        can_checkout:
          type: boolean
      required:
      - can_checkout
      - freight_total
      - item_count
      - lines
      - subtotal
      - total
    CartLine:
      type: object
      properties:
        id:
          type: integer
        offer_id:
          type: integer
        product:
          $ref: '#/components/schemas/CartProduct'
        seller:
          $ref: '#/components/schemas/CartSeller'
        quantity:
          type: integer
        unit_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        unit_freight:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        line_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        line_freight:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        available:
          type: integer
          description: Units currently in stock (not reserved for you)
        warning:
          nullable: true
          description: |-
            Set when checkout would fail for this line right now

            * `out_of_stock` - out_of_stock
            * `insufficient_stock` - insufficient_stock
          oneOf:
          - $ref: '#/components/schemas/WarningEnum'
          - $ref: '#/components/schemas/NullEnum'
      required:
      - available
      - id
      - line_freight
      - line_total
      - offer_id
      - product
      - quantity
      - seller
      - unit_freight
      - unit_price
      - warning
    CartProduct:
      type: object
      properties:
        slug:
          type: string
        name:
          type: string
        category:
          allOf:
          - $ref: '#/components/schemas/CategoryRef'
          nullable: true
      required:
      - category
      - name
      - slug
    CartSeller:
      type: object
      properties:
        id:
          type: string
          description: First 8 chars of the Olist seller id
        city:
          type: string
        state:
          type: string
      required:
      - city
      - id
      - state
    Category:
      type: object
      properties:
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        label:
          type: string
          readOnly: true
        group:
          allOf:
          - $ref: '#/components/schemas/GroupEnum'
          readOnly: true
          description: |-
            Drives the placeholder image

            * `appliances` - appliances
            * `auto` - auto
            * `beauty` - beauty
            * `electronics` - electronics
            * `fashion` - fashion
            * `food` - food
            * `furniture` - furniture
            * `general` - general
            * `housewares` - housewares
            * `media` - media
            * `pets` - pets
            * `sports` - sports
            * `textiles` - textiles
            * `tools` - tools
            * `toys` - toys
        product_count:
          type: integer
          readOnly: true
      required:
      - group
      - label
      - product_count
      - slug
    CategoryRef:
      type: object
      properties:
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        label:
          type: string
          readOnly: true
        group:
          allOf:
          - $ref: '#/components/schemas/GroupEnum'
          readOnly: true
          description: |-
            Drives the placeholder image

            * `appliances` - appliances
            * `auto` - auto
            * `beauty` - beauty
            * `electronics` - electronics
            * `fashion` - fashion
            * `food` - food
            * `furniture` - furniture
            * `general` - general
            * `housewares` - housewares
            * `media` - media
            * `pets` - pets
            * `sports` - sports
            * `textiles` - textiles
            * `tools` - tools
            * `toys` - toys
      required:
      - group
      - label
      - slug
    CategoryRow:
      type: object
      properties:
        slug:
          type: string
        label:
          type: string
        revenue:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        units:
          type: integer
      required:
      - label
      - revenue
      - slug
      - units
    CheckoutRequest:
      type: object
      properties:
        shipping:
          $ref: '#/components/schemas/ShippingAddressRequest'
      required:
      - shipping
    CodeEnum:
      enum:
      - out_of_stock
      - reservation_expired
      - invalid_transition
      - idempotency_conflict
      - empty_cart
      - replay_read_only
      type: string
      description: |-
        * `out_of_stock` - out_of_stock
        * `reservation_expired` - reservation_expired
        * `invalid_transition` - invalid_transition
        * `idempotency_conflict` - idempotency_conflict
        * `empty_cart` - empty_cart
        * `replay_read_only` - replay_read_only
    ConsumerStatus:
      type: object
      properties:
        name:
          type: string
        processed_at:
          type: string
          format: date-time
          nullable: true
          description: null = not processed (yet)
      required:
      - name
      - processed_at
    Csrf:
      type: object
      properties:
        csrf_token:
          type: string
          readOnly: true
      required:
      - csrf_token
    DailyPoint:
      type: object
      properties:
        day:
          type: string
          format: date
        orders:
          type: integer
        paid_orders:
          type: integer
        gmv:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
      required:
      - day
      - gmv
      - orders
      - paid_orders
    Dashboard:
      type: object
      properties:
        source:
          $ref: '#/components/schemas/DashboardSourceEnum'
        date_from:
          type: string
          format: date
        date_to:
          type: string
          format: date
        first_day:
          type: string
          format: date
          nullable: true
          description: First day with data (for this source)
        last_day:
          type: string
          format: date
          nullable: true
        kpis:
          $ref: '#/components/schemas/Kpis'
        daily:
          type: array
          items:
            $ref: '#/components/schemas/DailyPoint'
        by_category:
          type: array
          items:
            $ref: '#/components/schemas/CategoryRow'
        by_state:
          type: array
          items:
            $ref: '#/components/schemas/StateRow'
        delivery_by_week:
          type: array
          items:
            $ref: '#/components/schemas/DeliveryWeek'
      required:
      - by_category
      - by_state
      - daily
      - date_from
      - date_to
      - delivery_by_week
      - first_day
      - kpis
      - last_day
      - source
    DashboardSourceEnum:
      enum:
      - all
      - olist
      - app
      - replay
      type: string
      description: |-
        * `all` - all
        * `olist` - olist
        * `app` - app
        * `replay` - replay
    DeadLetterRetry:
      type: object
      properties:
        dlq_entry_id:
          type: string
          readOnly: true
        event_id:
          type: string
          readOnly: true
        consumer:
          type: string
          readOnly: true
        stream:
          type: string
          readOnly: true
        new_entry_id:
          type: string
          readOnly: true
        retried_by:
          type: string
          format: email
          readOnly: true
          nullable: true
        retried_at:
          type: string
          format: date-time
          readOnly: true
        created:
          type: boolean
          description: false = this entry had already been retried (no new delivery)
      required:
