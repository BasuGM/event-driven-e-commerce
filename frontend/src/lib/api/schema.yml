openapi: 3.0.3
info:
  title: Event-driven e-commerce API
  version: 0.1.0
  description: E-commerce platform seeded with the Olist Brazilian E-Commerce dataset.
paths:
  /api/auth/csrf/:
    get:
      operationId: auth_csrf_retrieve
      description: Sets the csrftoken cookie. The browser sends it back as X-CSRFToken
        on unsafe requests.
      summary: Get a CSRF token (sets the csrftoken cookie)
      tags:
      - auth
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Csrf'
          description: ''
  /api/auth/login/:
    post:
      operationId: auth_login_create
      summary: Log in with email and password
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      summary: Log out
      tags:
      - auth
      security:
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      summary: The logged-in user, or null
      tags:
      - auth
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/auth/register/:
    post:
      operationId: auth_register_create
      summary: Create an account and log in
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/cart/:
    get:
      operationId: cart_retrieve
      summary: Your cart with current prices and availability
      tags:
      - cart
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
  /api/cart/items/:
    post:
      operationId: cart_items_create
      summary: Add an offer to your cart
      tags:
      - cart
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCartItemRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AddCartItemRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AddCartItemRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
  /api/cart/items/{item_id}/:
    patch:
      operationId: cart_items_partial_update
      summary: Change a line's quantity
      parameters:
      - in: path
        name: item_id
        schema:
          type: integer
        required: true
      tags:
      - cart
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUpdateCartItemRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUpdateCartItemRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUpdateCartItemRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
    delete:
      operationId: cart_items_destroy
      summary: Remove a line
      parameters:
      - in: path
        name: item_id
        schema:
          type: integer
        required: true
      tags:
      - cart
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/categories/:
    get:
      operationId: categories_list
      summary: Categories that have at least one product
      tags:
      - categories
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
          description: ''
  /api/checkout/:
    post:
      operationId: checkout_create
      summary: Place an order from your cart (holds stock until you pay)
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: Unique per checkout attempt (8-255 chars). Retries reuse it.
        required: true
      tags:
      - checkout
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainError'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainError'
          description: ''
  /api/health/:
    get:
      operationId: health_retrieve
      summary: Status of the database and Redis
      tags:
      - health
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/orders/:
    get:
      operationId: orders_list
      summary: Your orders, newest first
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - orders
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOrderListList'
          description: ''
  /api/orders/{order_id}/:
    get:
      operationId: orders_retrieve
      summary: One of your orders
      parameters:
      - in: path
        name: order_id
        schema:
          type: string
        required: true
      tags:
      - orders
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
          description: ''
  /api/orders/{order_id}/cancel/:
    post:
      operationId: orders_cancel_create
      summary: Cancel an unpaid order (returns its stock)
      parameters:
      - in: path
        name: order_id
        schema:
          type: string
        required: true
      tags:
      - orders
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainError'
          description: ''
  /api/orders/{order_id}/pay/:
    post:
      operationId: orders_pay_create
      summary: 'Simulate a payment (dev/test only: ALLOW_FAKE_PAYMENTS)'
      parameters:
      - in: path
        name: order_id
        schema:
          type: string
        required: true
      tags:
      - orders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PayRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PayRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainError'
          description: ''
  /api/products/:
    get:
      operationId: products_list
      summary: Browse, filter and search products
      parameters:
      - in: query
        name: category
        schema:
          type: string
          minLength: 1
          pattern: ^[-a-zA-Z0-9_]+$
        description: Category slug
      - in: query
        name: in_stock
        schema:
          type: boolean
          nullable: true
        description: true = only products you can buy
      - in: query
        name: max_price
        schema:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
      - in: query
        name: min_price
        schema:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
      - in: query
        name: min_rating
        schema:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,2})?$
      - in: query
        name: ordering
        schema:
          enum:
          - popular
          - price
          - -price
          - rating
          - newest
          type: string
          minLength: 1
        description: |-
          Default: relevance when searching, otherwise popular

          * `popular` - popular
          * `price` - price
          * `-price` - -price
          * `rating` - rating
          * `newest` - newest
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
          maxLength: 100
        description: Search product and category names (prefix match, e.g. 'duv cov')
      tags:
      - products
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProductListList'
          description: ''
  /api/products/{slug}/:
    get:
      operationId: products_retrieve
      summary: Product detail with offers
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - products
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetail'
          description: ''
  /api/products/{slug}/reviews/:
    get:
      operationId: products_reviews_list
      summary: Reviews of orders containing this product, newest first
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - products
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProductReviewList'
          description: ''
  /api/stats/:
    get:
      operationId: stats_retrieve
      summary: Row counts for the dashboard
      tags:
      - stats
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stats'
          description: ''
components:
  schemas:
    AddCartItemRequest:
      type: object
      properties:
        offer_id:
          type: integer
        quantity:
          type: integer
          maximum: 10
          minimum: 1
          default: 1
      required:
      - offer_id
    BlankEnum:
      enum:
      - ''
    Cart:
      type: object
      properties:
        lines:
          type: array
          items:
            $ref: '#/components/schemas/CartLine'
        item_count:
          type: integer
          description: Total units
        subtotal:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        freight_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        total:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        can_checkout:
          type: boolean
      required:
      - can_checkout
      - freight_total
      - item_count
      - lines
      - subtotal
      - total
    CartLine:
      type: object
      properties:
        id:
          type: integer
        offer_id:
          type: integer
        product:
          $ref: '#/components/schemas/CartProduct'
        seller:
          $ref: '#/components/schemas/CartSeller'
        quantity:
          type: integer
        unit_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        unit_freight:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        line_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        line_freight:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        available:
          type: integer
          description: Units currently in stock (not reserved for you)
        warning:
          nullable: true
          description: |-
            Set when checkout would fail for this line right now

            * `out_of_stock` - out_of_stock
            * `insufficient_stock` - insufficient_stock
          oneOf:
          - $ref: '#/components/schemas/WarningEnum'
          - $ref: '#/components/schemas/NullEnum'
      required:
      - available
      - id
      - line_freight
      - line_total
      - offer_id
      - product
      - quantity
      - seller
      - unit_freight
      - unit_price
      - warning
    CartProduct:
      type: object
      properties:
        slug:
          type: string
        name:
          type: string
        category:
          allOf:
          - $ref: '#/components/schemas/CategoryRef'
          nullable: true
      required:
      - category
      - name
      - slug
    CartSeller:
      type: object
      properties:
        id:
          type: string
          description: First 8 chars of the Olist seller id
        city:
          type: string
        state:
          type: string
      required:
      - city
      - id
      - state
    Category:
      type: object
      properties:
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        label:
          type: string
          readOnly: true
        group:
          allOf:
          - $ref: '#/components/schemas/GroupEnum'
          readOnly: true
          description: |-
            Drives the placeholder image

            * `appliances` - appliances
            * `auto` - auto
            * `beauty` - beauty
            * `electronics` - electronics
            * `fashion` - fashion
            * `food` - food
            * `furniture` - furniture
            * `general` - general
            * `housewares` - housewares
            * `media` - media
            * `pets` - pets
            * `sports` - sports
            * `textiles` - textiles
            * `tools` - tools
            * `toys` - toys
        product_count:
          type: integer
          readOnly: true
      required:
      - group
      - label
      - product_count
      - slug
    CategoryRef:
      type: object
      properties:
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        label:
          type: string
          readOnly: true
        group:
          allOf:
          - $ref: '#/components/schemas/GroupEnum'
          readOnly: true
          description: |-
            Drives the placeholder image

            * `appliances` - appliances
            * `auto` - auto
            * `beauty` - beauty
            * `electronics` - electronics
            * `fashion` - fashion
            * `food` - food
            * `furniture` - furniture
            * `general` - general
            * `housewares` - housewares
            * `media` - media
            * `pets` - pets
            * `sports` - sports
            * `textiles` - textiles
            * `tools` - tools
            * `toys` - toys
      required:
      - group
      - label
      - slug
    CheckoutRequest:
      type: object
      properties:
        shipping:
          $ref: '#/components/schemas/ShippingAddressRequest'
      required:
      - shipping
    CodeEnum:
      enum:
      - out_of_stock
      - reservation_expired
      - invalid_transition
      - idempotency_conflict
      - empty_cart
      type: string
      description: |-
        * `out_of_stock` - out_of_stock
        * `reservation_expired` - reservation_expired
        * `invalid_transition` - invalid_transition
        * `idempotency_conflict` - idempotency_conflict
        * `empty_cart` - empty_cart
    Csrf:
      type: object
      properties:
        csrf_token:
          type: string
          readOnly: true
      required:
      - csrf_token
    Dimensions:
      type: object
      properties:
        weight_g:
          type: integer
          nullable: true
        length_cm:
          type: integer
          nullable: true
        width_cm:
          type: integer
          nullable: true
        height_cm:
          type: integer
          nullable: true
      required:
      - height_cm
      - length_cm
      - weight_g
      - width_cm
    DomainError:
      type: object
      description: Body of every 409 (and empty-cart 400) from the order flow.
      properties:
        code:
          $ref: '#/components/schemas/CodeEnum'
        detail:
          type: string
        lines:
          type: array
          items:
            $ref: '#/components/schemas/ErrorLine'
        current_status:
          type: string
      required:
      - code
      - detail
    ErrorLine:
      type: object
      properties:
        offer_id:
          type: integer
        product:
          type: string
        requested:
          type: integer
        available:
          type: integer
      required:
      - available
      - offer_id
      - product
      - requested
    GroupEnum:
      enum:
      - appliances
      - auto
      - beauty
      - electronics
      - fashion
      - food
      - furniture
      - general
      - housewares
      - media
      - pets
      - sports
      - textiles
      - tools
      - toys
      type: string
      description: |-
        * `appliances` - appliances
        * `auto` - auto
        * `beauty` - beauty
        * `electronics` - electronics
        * `fashion` - fashion
        * `food` - food
        * `furniture` - furniture
        * `general` - general
        * `housewares` - housewares
        * `media` - media
        * `pets` - pets
        * `sports` - sports
        * `textiles` - textiles
        * `tools` - tools
        * `toys` - toys
    Health:
      type: object
      properties:
        status:
          allOf:
          - $ref: '#/components/schemas/HealthStatusEnum'
          description: |-
            'ok' only if every dependency is ok

            * `ok` - ok
            * `error` - error
        db:
          $ref: '#/components/schemas/HealthStatusEnum'
        redis:
          $ref: '#/components/schemas/HealthStatusEnum'
      required:
      - db
      - redis
      - status
    HealthStatusEnum:
      enum:
      - ok
      - error
      type: string
      description: |-
        * `ok` - ok
        * `error` - error
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          minLength: 1
      required:
      - email
      - password
    Me:
      type: object
      properties:
        user:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
          nullable: true
        cart_count:
          type: integer
          readOnly: true
          description: Units in your cart (0 when logged out)
      required:
      - cart_count
      - user
    NullEnum:
      enum:
      - null
    Offer:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        seller_id:
          type: string
          readOnly: true
        seller_city:
          type: string
          readOnly: true
        seller_state:
          type: string
          readOnly: true
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
          description: Median Olist item price for this pair
        in_stock:
          type: boolean
          readOnly: true
      required:
      - id
      - in_stock
      - price
      - seller_city
      - seller_id
      - seller_state
    OrderDetail:
      type: object
      description: |-
        Expects an order from ``selectors.orders_with_totals()`` with items (product, category,
        seller), status history and reservations prefetched.

        Money comes from DB annotations through DecimalFields: a Decimal returned by a
        SerializerMethodField would be rendered as a JSON float by DRF's encoder.
      properties:
        id:
          type: string
        status:
          allOf:
          - $ref: '#/components/schemas/OrderStatusEnum'
          readOnly: true
        purchased_at:
          type: string
          format: date-time
          readOnly: true
        approved_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        lines:
          type: array
          items:
            $ref: '#/components/schemas/OrderLine'
          readOnly: true
        item_count:
          type: integer
        items_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        freight_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        total:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        shipping:
          $ref: '#/components/schemas/Shipping'
        status_history:
          type: array
          items:
            $ref: '#/components/schemas/StatusHistory'
        reservation_expires_at:
          type: string
          format: date-time
          nullable: true
        can_pay:
          type: boolean
          readOnly: true
        can_cancel:
          type: boolean
          readOnly: true
        payments_enabled:
          type: boolean
          readOnly: true
      required:
      - approved_at
      - can_cancel
      - can_pay
      - freight_total
      - id
      - item_count
      - items_total
      - lines
      - payments_enabled
      - purchased_at
      - reservation_expires_at
      - shipping
      - status
      - status_history
      - total
    OrderLine:
      type: object
      properties:
        product_slug:
          type: string
        product_name:
          type: string
        category:
          allOf:
          - $ref: '#/components/schemas/CategoryRef'
          nullable: true
        seller_id:
          type: string
        seller_city:
          type: string
        seller_state:
          type: string
        quantity:
          type: integer
        unit_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        unit_freight:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        line_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
      required:
      - category
