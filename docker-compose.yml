services:
  db:
    image: postgres:17
    env_file: .env
    ports:
      - "${DB_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./data/snapshots:/snapshots
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - ./data:/data:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Celery worker + beat (scheduler) share the backend image and code.
  worker:
    build: ./backend
    env_file: .env
    command: celery -A config worker -l info --concurrency 2
    volumes:
      - ./backend:/app
      - ./data:/data:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build: ./backend
    env_file: .env
    # Schedule state in /tmp so beat never writes into the bind-mounted source tree
    command: celery -A config beat -l info -s /tmp/celerybeat-schedule
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    env_file: .env
    command: npm run dev
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

  # Playwright smoke tests: `make e2e`. Not started by `make up` (compose profile).
  e2e:
    # Must match @playwright/test in frontend/package.json
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    profiles: ["e2e"]
    working_dir: /app
    environment:
      BASE_URL: http://frontend:3000
      CI: "1"
      E2E_USER_EMAIL: customer@example.com
      E2E_USER_PASSWORD: ${DEV_USER_PASSWORD:-devpass123}
    command: ["sh", "e2e/run.sh"]
    volumes:
      - ./frontend:/app
      - e2e_node_modules:/app/node_modules
    depends_on:
      - frontend

volumes:
  pgdata:
  e2e_node_modules:
