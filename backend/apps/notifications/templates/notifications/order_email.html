<!doctype html>
<html lang="en">
<body style="margin:0;padding:24px;background:#f6f6f4;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#1a1a1a;">
  <div style="max-width:560px;margin:0 auto;background:#ffffff;border:1px solid #e5e5e5;border-radius:12px;padding:24px;">
    <p style="margin:0 0 4px;font-weight:600;">Olist Commerce</p>
    <h1 style="font-size:20px;margin:0 0 16px;">{{ subject }}</h1>
    <p style="margin:0 0 8px;">Hi {{ name }},</p>
    <p style="margin:0 0 20px;line-height:1.5;">{{ intro }}</p>
    <table style="width:100%;border-collapse:collapse;font-size:14px;" role="presentation">
      <tr><th align="left" colspan="2" style="padding:0 0 8px;font-family:monospace;">Order {{ number }}</th></tr>
      {% for line in lines %}
      <tr>
        <td style="padding:6px 0;border-top:1px solid #eee;">{{ line.quantity }} &times; {{ line.name }}</td>
        <td align="right" style="padding:6px 0;border-top:1px solid #eee;white-space:nowrap;">{{ line.total }}</td>
      </tr>
      {% endfor %}
      <tr><td style="padding:10px 0 2px;border-top:1px solid #ddd;color:#666;">Items</td><td align="right" style="padding:10px 0 2px;border-top:1px solid #ddd;">{{ items_total }}</td></tr>
      <tr><td style="padding:2px 0;color:#666;">Shipping</td><td align="right" style="padding:2px 0;">{{ freight_total }}</td></tr>
      <tr><td style="padding:6px 0;font-weight:600;">Total</td><td align="right" style="padding:6px 0;font-weight:600;">{{ total }}</td></tr>
    </table>
    <p style="margin:24px 0 0;"><a href="{{ order_url }}" style="display:inline-block;background:#1a1a1a;color:#ffffff;text-decoration:none;padding:10px 16px;border-radius:8px;">View your order</a></p>
  </div>
</body>
</html>
