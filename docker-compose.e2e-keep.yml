# Added by scripts/e2e.sh only with KEEP_E2E=1 or in lab mode (make lab-up): the kept stack's
# frontend is reachable from the host at http://localhost:3101 (the browser origin must then be
# trusted for CSRF), and its Mailpit web UI at http://localhost:8125. Plain `make e2e` publishes
# no host ports. The database and Redis stay unpublished: reach them with `docker compose exec`.

x-keep-django-env: &keep-django-env
  POSTGRES_DB: ecommerce_e2e
  POSTGRES_HOST: db
  FRONTEND_PUBLIC_URL: http://localhost:3101
  CSRF_TRUSTED_ORIGINS: http://localhost:3101,http://frontend:3000

services:
  frontend:
    ports:
      - "3101:3000"
  mailpit:
    ports:
      - "8125:8025"
  backend:
    environment: *keep-django-env
  worker:
    environment: *keep-django-env
  beat:
    environment: *keep-django-env
  stream:
    environment: *keep-django-env
  relay:
    environment: *keep-django-env
  consumers:
    environment: *keep-django-env
